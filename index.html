<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1120">
<title>Live Gold Trading Dashboard</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b1120; color: #e7eefb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px 20px; background: #111b2d; border-bottom: 1px solid #283750; text-align: center; }
  h1 { font-size: 20px; color: #ffd700; letter-spacing: 0.5px; }
  small { color: #94a6c2; font-size: 12px; }
  
  main { max-width: 1200px; margin: auto; padding: 12px; }
  
  .card { background: #121e32; border: 1px solid #293952; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .chart-container { height: 500px; width: 100%; border-radius: 8px; overflow: hidden; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 10px; }
  .stat-card { background: #182842; border: 1px solid #2f4363; border-radius: 10px; padding: 12px; text-align: center; }
  .stat-title { font-size: 11px; color: #94a6c2; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 18px; font-weight: bold; margin-top: 6px; }
  
  .green { color: #20d99a; }
  .red { color: #ff6678; }
  .yellow { color: #ffce70; }

  footer { text-align: center; padding: 16px; color: #64748b; font-size: 12px; }

  @media (max-width: 600px) {
    .chart-container { height: 420px; }
  }
</style>
</head>

<body>

<header>
  <h1>⚡ LIVE GOLD (XAUUSD) DASHBOARD</h1>
  <small>Real-Time Market Chart & Technical Overview</small>
</header>

<main>
  <!-- LIVE TRADINGVIEW CHART CONTAINER -->
  <section class="card">
    <div class="chart-container" id="tv_chart_container"></div>
  </section>

  <!-- QUICK MARKET SUMMARY -->
  <section class="grid">
    <div class="stat-card">
      <div class="stat-title">Market Instrument</div>
      <div class="stat-value yellow">XAU / USD</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Live Connection</div>
      <div class="stat-value green">ACTIVE 🟢</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Primary Trend</div>
      <div class="stat-value green">BULLISH</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Key Resistance</div>
      <div class="stat-value red">D1 High</div>
    </div>
  </section>
</main>

<footer>
  Advanced Gold Analytics • Powered by TradingView Live Feed
</footer>

<!-- TradingView Widget Script -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="text/javascript">
  new TradingView.widget({
    "autosize": true,
    "symbol": "OANDA:XAUUSD",
    "interval": "5",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#121e32",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "allow_symbol_change": true,
    "save_image": false,
    "container_id": "tv_chart_container",
    "studies": [
      "STD;EMA",
      "STD;RSI"
    ]
  });
</script>

</body>
</html>
